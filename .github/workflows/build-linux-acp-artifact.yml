name: Build Linux buzz-acp artifact

on:
  push:
    branches: [build/linux-acp-artifact]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - run: cargo build --release -p buzz-acp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buzz-acp-linux-x86_64-${{ github.sha }}
          path: target/release/buzz-acp
          if-no-files-found: error
          retention-days: 1
